<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요양기관기호 즉시 조회</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; text-align: center; }
        .title-area { margin-bottom: 30px; }
        .title-area h1 { font-size: 28px; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .title-area p { color: #64748b; font-size: 15px; }
        .search-box { display: flex; gap: 10px; background: white; padding: 10px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); margin-bottom: 30px; }
        .search-box input { flex: 1; border: none; padding: 12px 16px; font-size: 16px; outline: none; background: transparent; }
        .search-box button { background-color: #4f46e5; color: white; border: none; padding: 0 24px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .search-box button:hover { background-color: #4338ca; }
        .search-box button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #result { display: flex; flex-direction: column; gap: 16px; width: 100%; text-align: left; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; position: relative; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .hosp-name { font-size: 19px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .hosp-addr { font-size: 14px; color: #64748b; margin-bottom: 14px; }
        .badge { display: inline-block; font-size: 12px; font-weight: 600; color: #4f46e5; background: #e0e7ff; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px; }
        .ykiho-wrapper { display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 12px 16px; border-radius: 10px; border: 1px dashed #cbd5e1; }
        .ykiho-num { font-size: 18px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px; }
        .copy-btn { margin-left: auto; background: white; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
        .copy-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
        .error-msg { color: #ef4444; background: #fef2f2; padding: 12px 16px; border-radius: 12px; border: 1px solid #fee2e2; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="title-area">
        <h1>🏥 요양기관기호 조회</h1>
        <p>병원명 입력 → 8자리 기호 즉시 조회</p>
    </div>

    <div class="search-box">
        <input type="text" id="inp" placeholder="예: 안동 성소병원 또는 강태영내과">
        <button id="btn">조회</button>
    </div>

    <div id="result"></div>
</div>

<script>
const WORKER = 'https://royal-field-b7e1.shrckdi1.workers.dev';

// html 상에서 onclick 지우고 안정적인 표준 이벤트 리스너 방식으로 버튼 활성화
document.getElementById('btn').addEventListener('click', doSearch);
document.getElementById('inp').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        doSearch();
    }
});

async function doSearch() {
    const name = document.getElementById('inp').value.trim();
    if (!name) return;

    const btn = document.getElementById('btn');
    const div = document.getElementById('result');

    btn.disabled = true;
    div.innerHTML = '<div style="text-align:center; color:#4f46e5; font-weight:600;">🔍 심평원 서버에서 조회 중...</div>';

    try {
        const r1 = await fetch(WORKER + '?q=' + encodeURIComponent(name));
        if (!r1.ok) {
            div.innerHTML = '<div class="error-msg">❌ 서버 연결 실패. 잠시 후 다시 시도해 주세요.</div>';
            return;
        }

        const j1 = await r1.json();
        const list = j1.items || [];

        if (list.length === 0) {
            div.innerHTML = '<div class="error-msg">📭 검색 결과가 없습니다. 병원명을 짧게 입력해 보세요.</div>';
            return;
        }

        let html = '';
        
        for (let i = 0; i < list.length; i++) {
            if (i >= 5) break; 
            const h = list[i];
            let ykiho = '-';
            
            const r2 = await fetch(WORKER + '?ykiho=' + encodeURIComponent(h.ykiho));
            if (r2.ok) {
                const j2 = await r2.json();
                ykiho = j2.ykiho || '-';
            }

            const addr = h.addr1 || '주소 정보 없음';

            // 오류 가능성 제로인 순수 문자열 결합 방식으로 전면 변경
            html += '<div class="card">';
            html += '<div class="hosp-name">' + h.yadmNm + '</div>';
            html += '<div class="hosp-addr">' + addr + '</div>';
            html += '<div class="badge">요양기관기호</div>';
            html += '<div class="ykiho-wrapper">';
            html += '<div class="ykiho-num">' + ykiho + '</div>';
            
            if (ykiho !== '-') {
                html += '<button class="copy-btn" onclick="copy(\'' + ykiho + '\', this)">📋 복사</button>';
            }
            
            html += '</div>';
            html += '</div>';
        }
        div.innerHTML = html;

    } catch(e) {
        div.innerHTML = '<div class="error-msg">⚠️ 시스템 오류: ' + e.message + '</div>';
    } finally {
        btn.disabled = false;
    }
}

function copy(text, btn) {
    navigator.clipboard.writeText(text).then(function() {
        btn.textContent = '✅ 복사됨!';
        setTimeout(function() { btn.textContent = '📋 복사'; }, 1500);
    });
}
</script>

</body>
</html>
