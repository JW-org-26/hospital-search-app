<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요양기관기호 조회</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f0f4f8; }
        .search-box { margin: 20px 0; }
        input { padding: 12px; width: 280px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; }
        button { padding: 12px 18px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #a5b4fc; }
        .card { background: #fff; border-radius: 12px; padding: 20px; margin: 10px auto; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: left; }
        .hosp-name { font-weight: bold; font-size: 16px; }
        .hosp-addr { font-size: 12px; color: #666; margin: 5px 0; }
        .ykiho { font-size: 24px; font-weight: 900; color: #4f46e5; margin: 8px 0; }
        .copy-btn { padding: 6px 14px; background: #e0e7ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .msg { color: #888; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>🏥 요양기관기호 조회</h2>
    <p style="color:#888;font-size:13px">예: 서울숲내과, 남양주 연세의원</p>
    <div class="search-box">
        <input type="text" id="inp" placeholder="병원명 입력" onkeydown="if(event.key==='Enter')doSearch()">
        <button id="btn" onclick="doSearch()">조회</button>
    </div>
    <div id="result"></div>

    <script>
        const WORKER = 'https://royal-field-b7e1.shrckdi1.workers.dev';

        async function doSearch() {
            const raw = document.getElementById('inp').value.trim();
            if (!raw) return;
            
            const btn = document.getElementById('btn');
            const div = document.getElementById('result');
            btn.disabled = true;
            div.innerHTML = '<div class="msg">🔍 검색 중...</div>';

            // 1. 입력 분석: 지역명과 병원명 분리
            const parts = raw.split(/\s+/);
            const area = parts.length > 1 ? parts[0] : '';
            const rawName = parts.length > 1 ? parts.slice(1).join('') : raw;
            const cleanName = rawName.replace(/\s+/g, '');

            // 2. 스마트 검색어 생성 (전체이름 -> 접미사 제거이름)
            const strippedName = cleanName.replace(/(내과|외과|의원|병원|정형외과|이비인후과|치과|한의원|클리닉|피부과|안과)$/, '');
            const searchQueries = [cleanName];
            if (strippedName !== cleanName && strippedName.length >= 2) searchQueries.push(strippedName);

            // 3. 순차적 검색 시도
            let list = [];
            for (let query of searchQueries) {
                list = await searchHira(query);
                if (list.length > 0) break;
            }

            // 4. 지역 필터링 (결과가 있다면)
            if (area && list.length > 0) {
                const filtered = list.filter(h => h.addr && h.addr.includes(area));
                if (filtered.length > 0) list = filtered;
            }

            if (!list.length) {
                div.innerHTML = '<div class="msg">검색 결과가 없습니다.<br>병원명을 조금 더 정확히 입력해보세요.</div>';
                btn.disabled = false;
                return;
            }

            // 5. 결과 상세 조회
            const results = await Promise.all(list.slice(0, 10).map(async h => {
                const r2 = await fetch(`${WORKER}/?ykiho=${encodeURIComponent(h.ykiho)}`);
                const j2 = await r2.json();
                return { name: h.yadmNm, addr: h.addr, ykiho: j2.ykiho };
            }));

            div.innerHTML = results.map(h => `
                <div class="card">
                    <div class="hosp-name">${h.name}</div>
                    <div class="hosp-addr">${h.addr}</div>
                    <div class="ykiho">${h.ykiho || '정보 없음'}</div>
                    ${h.ykiho ? `<button class="copy-btn" onclick="copyText('${h.ykiho}',this)">📋 복사</button>` : ''}
                </div>
            `).join('');
            btn.disabled = false;
        }

        async function searchHira(name) {
            try {
                const r = await fetch(`${WORKER}/?search=${encodeURIComponent(name)}`);
                const j = await r.json();
                const items = j?.response?.body?.items?.item || j?.items || [];
                return Array.isArray(items) ? items : (items ? [items] : []);
            } catch(e) { return []; }
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ 복사됨!';
                setTimeout(() => btn.textContent = '📋 복사', 1500);
            });
        }
    </script>
</body>
</html>
