<script>
    const WORKER = 'YOUR_WORKER_URL'; // 여기에 본인의 워커 URL 입력

    async function doSearch() {
        const raw = document.getElementById('inp').value.trim();
        if (!raw) return;
        
        const div = document.getElementById('result');
        const btn = document.getElementById('btn');
        btn.disabled = true;
        div.innerHTML = '<div class="msg">🔍 검색 및 상세 정보 조회 중...</div>';

        try {
            // 1. 병원 목록 조회
            const list = await searchHira(raw);
            if (!list.length) {
                div.innerHTML = '<div class="msg">검색 결과가 없습니다.</div>';
                return;
            }

            // 2. 순차적으로 상세 정보 조회 (서버 차단 방지)
            const results = [];
            for (const h of list.slice(0, 5)) { // 최대 5개로 제한
                const r2 = await fetch(`${WORKER}/?ykiho=${encodeURIComponent(h.ykiho)}`);
                const j2 = await r2.json();
                results.push({ name: h.yadmNm, addr: h.addr || '', ykiho: j2.ykiho });
                await new Promise(r => setTimeout(r, 500)); // 0.5초 간격 두기
            }

            div.innerHTML = results.map(h => `
                <div class="card">
                    <div class="hosp-name">${h.name}</div>
                    <div class="ykiho">${h.ykiho || '정보없음'}</div>
                </div>
            `).join('');
        } catch(e) {
            div.innerHTML = '<div class="warn">⚠️ 서버 연결 실패. 잠시 후 다시 시도하세요.</div>';
        } finally {
            btn.disabled = false;
        }
    }
    // ... searchHira 함수 등 나머지 동일 ...
</script>
