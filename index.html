<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요양기관기호 즉시 조회</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f4f8; color: #333; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 600px; width: 100%; text-align: center; }
    
    /* 타이틀 영역 */
    .title-area { margin-bottom: 30px; }
    .title-area h1 { font-size: 28px; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .title-area p { color: #64748b; font-size: 15px; }
    
    /* 검색바 영역 */
    .search-box { display: flex; gap: 10px; background: white; padding: 10px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); margin-bottom: 30px; }
    .search-box input { flex: 1; border: none; padding: 12px 16px; font-size: 16px; outline: none; background: transparent; }
    .search-box button { background-color: #4f46e5; color: white; border: none; padding: 0 24px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .search-box button:hover { background-color: #4338ca; }
    .search-box button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    
    /* 결과 카드 디자인 */
    #result { display: flex; flex-direction: column; gap: 16px; width: 100%; text-align: left; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; position: relative; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); }
    .hosp-name { font-size: 19px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .hosp-addr { font-size: 14px; color: #64748b; margin-bottom: 16px; line-height: 1.4; }
    .ykiho-label { font-size: 12px; font-weight: 600; color: #4f46e5; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .ykiho-value { font-size: 22px; font-weight: 800; color: #1e293b; letter-spacing: 0.5px; }
    
    /* 복사 버튼 */
    .copy-btn { position: absolute; right: 24px; bottom: 24px; background: #f1f5f9; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
    .copy-btn:hover { background: #e2e8f0; color: #1e293b; }
    
    .msg { text-align: center; color: #64748b; padding: 40px 0; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-area">
      <h1>🏥 요양기관기호 조회</h1>
      <p>병원명 입력 → 8자리 기호 즉시 조회</p>
    </div>

    <div class="search-box">
      <input type="text" id="inp" placeholder="예: 서울 강남내과 또는 대구 동산병원" onkeydown="if(event.key==='Enter') doSearch()">
      <button id="btn" onclick="doSearch()">조회</button>
    </div>

    <div id="result">
      <div class="msg">검색창에 지역명과 병원명을 함께 입력해 보세요!</div>
    </div>
  </div>

  <script>
    const WORKER = 'https://royal-field-b7e1.shrckdi1.workers.dev';
    const SIDO = {
      서울:'서울특별시', 부산:'부산광역시', 대구:'대구광역시', 인천:'인천광역시',
      광주:'광주광역시', 대전:'대전광역시', 울산:'울산광역시', 세종:'세종특별자치시',
      경기:'경기도', 강원:'강원특별자치도', 충북:'충청북도', 충남:'충청남도',
      전북:'전북특별자치도', 전남:'전라남도', 경북:'경상북도', 경남:'경상남도', 제주:'제주특별자치도'
    };

    async function doSearch() {
      const raw = document.getElementById('inp').value.trim();
      if (!raw) return;
      
      const btn = document.getElementById('btn');
      const div = document.getElementById('result');
      
      btn.disabled = true;
      div.innerHTML = '<div class="msg">🔍 심평원 데이터 매칭 중...</div>';

      try {
        let parts = raw.split(/\s+/);
        let sido = '';
        for (const [k, v] of Object.entries(SIDO)) {
          if (parts[0] === k || parts[0].startsWith(k)) {
            sido = v; 
            parts = parts.slice(1); 
            break;
          }
        }
        const name = parts.join(' ');

        // 1단계: 워커를 거쳐 심평원 내부 엔진 다이렉트 검색 (504 오류 원천 차단)
        const r1 = await fetch(`${WORKER}?q=${encodeURIComponent(name)}&sido=${encodeURIComponent(sido)}`);
        if (!r1.ok) {
          div.innerHTML = '<div class="msg">심평원 서버 시스템 응답 지연<br>잠시 후 다시 시도해 주세요.</div>';
          return;
        }
        
        const j1 = await r1.json();
        const list = j1.items || [];

        if (!list.length) {
          div.innerHTML = '<div class="msg">검색 결과가 없습니다.<br>병원 이름을 더 짧게 입력해 보세요.</div>';
          return;
        }

        // 2단계: 실시간 우회 팝업 매칭 루프 가동하여 8자리 평문 기호 추출
        let html = '';
        for (const h of list.slice(0, 5)) {
          const r2 = await fetch(`${WORKER}?ykiho=${encodeURIComponent(h.ykiho)}`);
          let ykiho = '-';
          if (r2.ok) {
            const j2 = await r2.json();
            ykiho = j2.ykiho || '-';
          }

          html += `<div class="card">
            <div class="hosp-name">${h.yadmNm}</div>
            <div class="hosp-addr">${h.addr1}</div>
            <div class="ykiho-label">요양기관기호</div>
            <div class="ykiho-value">${ykiho}</div>
            ${ykiho !== '-' ? `<button class="copy-btn" onclick="copy('${ykiho}',this)">📋 복사</button>` : ''}
          </div>`;
        }
        div.innerHTML = html;
      } catch(e) {
        div.innerHTML = `<div class="msg">⚠️ 오류 발생: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    // 복사 기능 함수
    function copy(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ 복사 완료';
        setTimeout(() => btn.textContent = '📋 복사', 1500);
      }).catch(() => {
        // 클립보드 API가 제한되는 환경을 위한 차선책
        const t = document.createElement('textarea');
        t.value = text; document.body.appendChild(t); t.select();
        document.execCommand('copy'); document.body.removeChild(t);
        btn.textContent = '✅ 복사 완료';
        setTimeout(() => btn.textContent = '📋 복사', 1500);
      });
    }
  </script>
</body>
</html>
