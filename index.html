<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>요양기관기호 조회</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🏥 요양기관기호 조회</h2>
    <p>병원명 입력 → 8자리 기호 즉시 조회</p>

    <input type="text" id="hospitalInput" placeholder="병원명을 입력하세요">
    <button onclick="searchHospital()">조회</button>

    <div id="result"></div>

    <script>
        // 🔥 여기에 회원님의 실제 Worker 주소를 넣으세요 (예: https://my-worker.subdomain.workers.dev)
        const WORKER_URL = "https://[본인의-워커-주소].workers.dev";

        async function searchHospital() {
            const input = document.getElementById('hospitalInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!input) {
                alert("병원명을 입력해주세요.");
                return;
            }

            resultDiv.innerText = "조회 중...";

            try {
                const response = await fetch(`${WORKER_URL}/?q=${encodeURIComponent(input)}`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const hospital = data.items[0];
                    resultDiv.innerHTML = `검색 결과: ${hospital.yadmNm} <br> 요양기관기호: ${hospital.ykiho}`;
                } else {
                    resultDiv.innerText = "해당 병원을 찾을 수 없습니다.";
                }
            } catch (e) {
                resultDiv.innerText = "오류가 발생했습니다. Worker 주소를 확인하세요.";
            }
        }
    </script>
</body>
</html>
