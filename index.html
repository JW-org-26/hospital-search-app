<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요양기관기호 조회</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f0f4f8; }
        .search-box { margin: 20px 0; }
        input { padding: 12px; width: 280px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; }
        button { padding: 12px 18px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        .msg { color: #888; margin-top: 20px; }
        .debug { background: #fff; border-radius: 8px; padding: 12px; margin: 10px auto; max-width: 500px; text-align: left; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>🏥 디버그 모드</h2>
    <div class="search-box">
        <input type="text" id="inp" placeholder="서울숲내과의원"
               onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">조회</button>
    </div>
    <div id="result"></div>
    <script>
        const WORKER = 'https://royal-field-b7e1.shrckdi1.workers.dev';

        async function doSearch() {
            const name = document.getElementById('inp').value.trim().replace(/\s+/g, '');
            const div = document.getElementById('result');
            div.innerHTML = '<div class="msg">🔍 조회 중...</div>';
            try {
                const r = await fetch(`${WORKER}/?search=${encodeURIComponent(name)}`);
                const text = await r.text();
                console.log('Worker 응답:', text);
                const j = JSON.parse(text);
                div.innerHTML = `<div class="debug"><b>검색어:</b> ${name}<br><b>응답:</b><br>${JSON.stringify(j, null, 2)}</div>`;
            } catch(e) {
                div.innerHTML = `<div class="msg">오류: ${e.message}</div>`;
                console.error(e);
            }
        }
    </script>
</body>
</html>
